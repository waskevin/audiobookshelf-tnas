version: "3.8"
services:
  audiobookshelf:
    image: advplyr/audiobookshelf:2.37.2
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "11011:80"
    volumes:
      - ./config:/config
      - ./metadata:/metadata
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
x-app-meta:
  web:
    port: 11011
    protocol: http
